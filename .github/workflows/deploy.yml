name: 🚀 SAGAR AI CI/CD & Cloud Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. Backend Testing & Verification
  backend-test:
    name: 🧪 Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: 🧪 Run Automated Pipeline Tests
        working-directory: server
        env:
          JWT_SECRET: ci_jwt_secret_key_testing_12345
          CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PORT: 5000
          NODE_ENV: test
        run: npm test

  # 2. Frontend Build & Static Generation
  frontend-build:
    name: ⚛️ Frontend Next.js Production Build
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: 🏗️ Build Production Bundle
        working-directory: client
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SOCKET_URL: /
          NODE_ENV: production
        run: npm run build

  # 3. Automated Docker Image Build (Optional GHCR Deployment)
  docker-deploy:
    name: 🐳 Docker Container Build & Verify
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: sagar-ai-server:latest

      - name: 🔨 Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: sagar-ai-client:latest
