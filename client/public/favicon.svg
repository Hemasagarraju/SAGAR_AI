<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#030712"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#border_grad)" stroke-width="2"/>
  
  <!-- Outer Hexagonal Shield -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" stroke="url(#hex_grad)" stroke-width="2.5" stroke-dasharray="6 3"/>
  
  <!-- Inner Quantum Diamond Core -->
  <polygon points="32,16 46,32 32,48 18,32" fill="rgba(6, 182, 212, 0.25)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Central Glowing AI Nexus Core -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" filter="drop-shadow(0 0 8px #06b6d4)"/>
  
  <!-- Multi-Agent Node Satellites -->
  <circle cx="32" cy="8" r="3.5" fill="#06b6d4"/>
  <circle cx="54" cy="44" r="3.5" fill="#818cf8"/>
  <circle cx="10" cy="44" r="3.5" fill="#c084fc"/>
  
  <defs>
    <linearGradient id="border_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hex_grad" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
</svg>
